<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRent B2B - Catálogo de Imóveis</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

  <!-- Navbar -->
  <nav class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">SmartRent B2B</h1>
        <p class="text-xs text-blue-200">Operação Canasvieiras - Florianópolis/SC</p>
      </div>
      <div class="flex space-x-6 text-sm font-semibold">
        <a href="index.html" class="hover:text-blue-300 transition">Dashboard (IA)</a>
        <a href="imoveis.html" class="text-blue-300 underline font-bold">Imóveis</a>
        <a href="reservas.html" class="hover:text-blue-300 transition">Nova Reserva</a>
      </div>
      <div id="areaAuth" class="flex items-center ml-6"></div>
    </div>
  </nav>

  <div class="container mx-auto mt-8 p-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-slate-700">Portfólio de Imóveis</h2>
      <span id="contadorImoveis"
        class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">carregando...</span>
    </div>

    <div id="gradeImoveis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    <p id="mensagemImoveis" class="hidden mt-6 p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800"></p>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/imovel-card.js"></script>
  <script>
    // Catálogo público: sem token a chamada sai sem Authorization e mesmo
    // assim responde, que é o comportamento do acesso público por padrão.
    async function carregarImoveis() {
      const grade = document.getElementById('gradeImoveis');
      const contador = document.getElementById('contadorImoveis');
      const aviso = document.getElementById('mensagemImoveis');
      try {
        const imoveis = await Api.get('/api/imoveis');
        grade.innerHTML = imoveis.map(ImovelCard.card).join('');
        contador.innerText = imoveis.length === 1
          ? '1 imóvel cadastrado'
          : imoveis.length + ' imóveis cadastrados';
        if (imoveis.length === 0) {
          aviso.innerText = 'Nenhum imóvel cadastrado ainda.';
          aviso.classList.remove('hidden');
        }
      } catch (e) {
        contador.innerText = 'indisponível';
        aviso.innerText = 'Não foi possível carregar os imóveis: ' + e.message;
        aviso.classList.remove('hidden');
      }
    }
    document.addEventListener('DOMContentLoaded', carregarImoveis);
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SmartRent B2B - Avisos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/mobile.css">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md shadow-blue-500/20">
          <i data-lucide="building-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 tracking-tight">
            SmartRent <span class="text-blue-600 font-semibold">B2B</span>
          </h1>
          <p class="text-[10px] text-slate-500 font-medium">Avisos da plataforma</p>
        </div>
      </div>
      <nav id="navPrincipal" class="flex items-center space-x-1 sm:space-x-2"></nav>
      <div id="areaAuth" class="flex items-center ml-4"></div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 space-y-4">
    <div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Avisos</h2>
      <p class="text-xs text-slate-500 mt-1">Mensagens da administração da plataforma para a sua conta: resultado de denúncias, avisos de moderação e comunicados do suporte.</p>
    </div>
    <div id="carregando" class="text-center py-16 text-sm text-slate-500">Carregando avisos...</div>
    <p id="erroPagina" class="hidden p-4 rounded-xl bg-rose-50 border border-rose-200 text-sm font-semibold text-rose-700"></p>
    <p id="vazio" class="hidden text-center py-16 text-sm text-slate-500">Você não tem avisos.</p>
    <ul id="lista" class="space-y-3"></ul>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
    <p>SmartRent B2B © 2026 • Operação Canasvieiras • Projeto Acadêmico</p>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/navegacao.js"></script>
  <script src="/js/comunicados.js"></script>
  <script>lucide.createIcons();</script>
  <script src="/js/telemetria.js" defer></script>
</body>

</html>

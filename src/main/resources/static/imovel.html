<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRent B2B - Detalhes do Imóvel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md shadow-blue-500/20">
          <i data-lucide="building-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 tracking-tight">
            SmartRent <span class="text-blue-600 font-semibold">B2B</span>
          </h1>
          <p class="text-[10px] text-slate-500 font-medium">Operação Canasvieiras • Detalhes do Imóvel</p>
        </div>
      </a>

      <nav id="navPrincipal" class="flex items-center space-x-1 sm:space-x-2"></nav>
      <div id="areaAuth" class="flex items-center ml-4"></div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <a href="/imoveis.html"
      class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 mb-4">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar ao catálogo
    </a>

    <div id="carregando" class="text-center py-20 text-sm text-slate-500">Carregando imóvel...</div>

    <p id="mensagemErro"
      class="hidden p-4 rounded-xl bg-amber-50 border border-amber-200 text-sm font-semibold text-amber-800"></p>

    <div id="conteudo" class="hidden"></div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-8">
    <p>SmartRent B2B © 2026 • Operação Canasvieiras • Projeto Acadêmico</p>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/navegacao.js"></script>
  <script src="/js/imovel-card.js"></script>
  <script src="/js/imovel-detalhe.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/reservar.js"></script>
  <script>
    lucide.createIcons();

    /** O id vem do caminho /imoveis/{id}; o ?id= continua aceito como alternativa. */
    function idDoImovel() {
      const doCaminho = location.pathname.match(/\/imoveis\/(\d+)/);
      if (doCaminho) { return doCaminho[1]; }
      return new URLSearchParams(location.search).get('id');
    }

    function mostrarErro(texto) {
      document.getElementById('carregando').classList.add('hidden');
      const erro = document.getElementById('mensagemErro');
      erro.innerText = texto;
      erro.classList.remove('hidden');
    }

    function desenhar(imovel) {
      document.title = 'SmartRent B2B - ' + imovel.titulo;
      const raiz = document.getElementById('conteudo');
      // O mesmo componente alimenta o preview do cadastro: ver imovel-detalhe.js.
      raiz.innerHTML = ImovelDetalhe.montar(imovel, {
        logado: Auth.isAuthenticated(),
        gestor: Auth.isGestor()
      });
      ImovelDetalhe.ativar(raiz, imovel, {
        aoAbrirChat: function () {
          location.href = '/smartchat.html?imovel=' + encodeURIComponent(imovel.id);
        },
        aoRegistrarReserva: function (datas) {
          // O gestor registra a reserva no painel, onde a regra de choque de
          // datas e o snapshot de preco sao aplicados pelo servidor.
          const params = new URLSearchParams({ aba: 'reservas', imovelId: imovel.id });
          if (datas.checkin) { params.set('checkin', datas.checkin); }
          if (datas.checkout) { params.set('checkout', datas.checkout); }
          if (datas.hospedes) { params.set('hospedes', datas.hospedes); }
          location.href = '/dashboard.html?' + params.toString();
        }
      });
      document.getElementById('carregando').classList.add('hidden');
      raiz.classList.remove('hidden');
    }

    async function carregar() {
      const id = idDoImovel();
      if (!id) { mostrarErro('Imóvel não informado no endereço.'); return; }
      try {
        desenhar(await Api.get('/api/imoveis/' + encodeURIComponent(id), { ignorar401: true }));
      } catch (e) {
        mostrarErro(e.status === 404
          ? 'Imóvel não encontrado. Ele pode ter sido removido do catálogo ou estar temporariamente fora do ar.'
          : 'Não foi possível carregar o imóvel: ' + e.message);
      }
    }

    document.addEventListener('DOMContentLoaded', carregar);
  </script>
</body>

</html>

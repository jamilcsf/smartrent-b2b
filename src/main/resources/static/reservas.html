<!DOCTYPE html>

<head>

  <title>SmartRent B2B - Gestão de Reservas</title>
  <!-- A gestão de reservas agora é uma aba do Painel do Gestor. Este endereço
       continua existindo para links antigos e leva para lá, preservando os
       parâmetros (imovelId, checkin, checkout). -->
  <meta http-equiv="refresh" content="0; url=/dashboard.html?aba=reservas">
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      params.set('aba', 'reservas');
      location.replace('/dashboard.html?' + params.toString());
    })();
  </script>
</head>

<body>
  <p style="font-family: sans-serif; padding: 2rem;">

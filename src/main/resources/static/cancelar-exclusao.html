<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- O link traz um token de uso unico: nada de enviar a URL como Referer a terceiros. -->
  <meta name="referrer" content="no-referrer">
  <title>SmartRent B2B - Cancelar solicitação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">
  <main class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-8 text-center space-y-4">
    <h1 class="text-xl font-extrabold text-slate-900">Cancelar pedido de exclusão de dados</h1>
    <p id="status" class="text-sm text-slate-600" role="status">
      Se você não fez esse pedido, cancele-o agora. As restrições temporárias da sua conta serão removidas.
    </p>
    <button type="button" id="btnCancelar" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white disabled:opacity-40">
      Não fui eu — cancelar solicitação
    </button>
    <a id="acao" href="/login.html" class="hidden inline-block px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white">Entrar</a>
  </main>

  <script>
    (function () {
      'use strict';
      var status = document.getElementById('status');
      var botao = document.getElementById('btnCancelar');
      var acao = document.getElementById('acao');
      var token = new URLSearchParams(location.search).get('token');
      // Tira o token da barra de enderecos e do historico. Abrir esta pagina NAO cancela nada: so o clique no botao.
      history.replaceState(null, '', location.pathname);

      if (!token) {
        botao.classList.add('hidden');
        status.textContent = 'Este link é inválido.';
        status.className = 'text-sm font-semibold text-rose-700';
        return;
      }
      botao.addEventListener('click', function () {
        botao.disabled = true;
        Api.post('/api/perfil/exclusao-dados/cancelar', { token: token }, { ignorar401: true }).then(function (r) {
          botao.classList.add('hidden');
          status.textContent = r.mensagem;
          status.className = 'text-sm font-semibold text-emerald-700';
          acao.classList.remove('hidden');
        }).catch(function (e) {
          botao.disabled = false;
          status.textContent = e.message || 'Não foi possível cancelar a solicitação.';
          status.className = 'text-sm font-semibold text-rose-700';
        });
      });
    })();
  </script>
</body>

</html>

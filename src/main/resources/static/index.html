<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRent B2B - Painel de Precificação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- Navegação -->
  <nav class="bg-blue-900 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">SmartRent B2B</h1>
      <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">Ambiente Web</span>
    </div>
  </nav>

  <div class="container mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Card: Sugestão de Preço por IA -->
    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Simulador de Precificação (IA / Contingência)</h2>
      <form id="formPrecificacao" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">ID do Imóvel</label>
          <input type="number" id="imovelId" value="1" class="w-full mt-1 p-2 border rounded-md" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600">Preço Base (R$)</label>
          <input type="number" id="valorBase" value="200.00" step="0.01" class="w-full mt-1 p-2 border rounded-md"
            required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600">Data de Referência</label>
          <input type="date" id="dataRef" class="w-full mt-1 p-2 border rounded-md" required>
        </div>
        <button type="button" onclick="consultarIA()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md transition">
          Calcular Sugestão de Preço
        </button>
      </form>

      <!-- Resultado -->
      <div id="resultadoIA" class="mt-6 p-4 rounded-md hidden">
        <p class="text-sm text-gray-600">Valor Sugerido:</p>
        <p id="valorSugerido" class="text-2xl font-bold text-green-600">R$ 0,00</p>
        <p id="origemCalculo" class="text-xs font-semibold mt-1 uppercase"></p>
      </div>
    </div>

    <!-- Card: Gráfico de Demanda -->
    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Projeção de Ocupação & Demanda</h2>
      <canvas id="graficoOcupacao"></canvas>
    </div>

  </div>

  <script>
    // Definir data padrão no input para hoje
    document.getElementById('dataRef').valueAsDate = new Date();

    async function consultarIA() {
      const imovelId = document.getElementById('imovelId').value;
      const valorBase = document.getElementById('valorBase').value;
      const dataRef = document.getElementById('dataRef').value;

      try {
        const response = await fetch(`/api/precificacao/sugerir?imovelId=${imovelId}&valorBase=${valorBase}&dataRef=${dataRef}`);
        const data = await response.json();

        const boxResultado = document.getElementById('resultadoIA');
        boxResultado.classList.remove('hidden');

        document.getElementById('valorSugerido').innerText = `R$ ${data.valorSugerido.toFixed(2)}`;

        const badgeOrigem = document.getElementById('origemCalculo');
        if (data.origemCalculo === 'IA_GROQ') {
          boxResultado.className = "mt-6 p-4 rounded-md bg-green-50 border border-green-200";
          badgeOrigem.innerText = "Origem: Processado via IA (Groq/Llama)";
          badgeOrigem.className = "text-xs font-semibold mt-1 text-green-700";
        } else {
          boxResultado.className = "mt-6 p-4 rounded-md bg-yellow-50 border border-yellow-200";
          badgeOrigem.innerText = "Origem: Regra de Contingência (Fallback Activo)";
          badgeOrigem.className = "text-xs font-semibold mt-1 text-yellow-700";
        }
      } catch (error) {
        alert("Erro ao conectar com a API de Precificação.");
      }
    }

    // Renderização do Gráfico Chart.js
    const ctx = document.getElementById('graficoOcupacao').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
        datasets: [{
          label: 'Taxa de Ocupação Estimada (%)',
          data: [40, 45, 50, 65, 85, 95, 70],
          borderColor: '#1d4ed8',
          backgroundColor: 'rgba(29, 78, 216, 0.1)',
          fill: true,
          tension: 0.3
        }]
      }
    });
  </script>
</body>

</html>

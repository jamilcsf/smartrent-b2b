<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRent B2B - Criar conta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-blue-900 min-h-screen flex flex-col items-center justify-center gap-3 p-3 sm:p-6">

  <!-- Painel dividido: formulário à esquerda, foto de Florianópolis à direita -->
  <main class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden grid lg:grid-cols-2 lg:min-h-[640px]">

    <section class="flex flex-col justify-center px-6 sm:px-12 lg:px-16 py-10">
      <div class="w-full max-w-sm mx-auto">
        <a href="index.html" class="flex items-center justify-center space-x-3 mb-8">
          <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md shadow-blue-500/20">
            <i data-lucide="building-2" class="w-5 h-5"></i>
          </div>
          <span class="text-xl font-bold text-slate-900 tracking-tight">
            SmartRent <span class="text-blue-600 font-semibold">B2B</span>
          </span>
        </a>

        <div class="text-center mb-6">
          <h1 class="text-3xl font-bold text-slate-900">Crie sua conta</h1>
          <p class="text-sm text-slate-500 mt-2">Leva menos de um minuto.</p>
        </div>

        <form id="formAuth" novalidate>
          <div class="mb-3">
            <label for="nome" class="block text-xs font-medium text-slate-500 mb-1.5">Nome completo</label>
            <input type="text" id="nome" autocomplete="name"
              class="w-full px-4 py-3 border rounded-xl border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Ex: Ana Beatriz Rocha">
            <p id="erro-nome" class="hidden mt-1 text-[11px] font-semibold text-rose-600"></p>
          </div>
          <div class="mb-3">
            <label for="email" class="block text-xs font-medium text-slate-500 mb-1.5">E-mail</label>
            <input type="email" id="email" autocomplete="email"
              class="w-full px-4 py-3 border rounded-xl border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="voce@exemplo.com">
            <p id="erro-email" class="hidden mt-1 text-[11px] font-semibold text-rose-600"></p>
          </div>
          <div class="mb-3">
            <label for="senha" class="block text-xs font-medium text-slate-500 mb-1.5">Senha</label>
            <input type="password" id="senha" autocomplete="new-password"
              class="w-full px-4 py-3 border rounded-xl border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Ao menos 8 caracteres">
            <p id="erro-senha" class="hidden mt-1 text-[11px] font-semibold text-rose-600"></p>
          </div>
          <div class="mb-5">
            <label for="confirmacaoSenha" class="block text-xs font-medium text-slate-500 mb-1.5">Confirmação de senha</label>
            <input type="password" id="confirmacaoSenha" autocomplete="new-password"
              class="w-full px-4 py-3 border rounded-xl border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Repita a senha">
            <p id="erro-confirmacaoSenha" class="hidden mt-1 text-[11px] font-semibold text-rose-600"></p>
          </div>

          <!-- reCAPTCHA: o widget é montado por js após ler /api/auth/config -->
          <div class="mb-4">
            <div id="captcha" class="flex justify-center min-h-[78px]"></div>
            <p id="erro-captcha" class="hidden mt-1 text-center text-[11px] font-semibold text-rose-600"></p>
          </div>

          <p id="mensagemGeral" class="hidden mb-4 p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-[11px] font-semibold text-rose-700"></p>

          <button type="submit" id="btnSubmit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-full shadow-md shadow-blue-600/20 text-sm transition">
            Criar conta
          </button>
        </form>

        <div class="flex items-center my-5">
          <span class="flex-1 border-t border-slate-200"></span>
          <span class="px-3 text-xs text-slate-400">ou</span>
          <span class="flex-1 border-t border-slate-200"></span>
        </div>

        <!-- Botão oficial do Google (quando há client ID); senão, o botão abaixo só avisa -->
        <div id="googleBotao" class="flex justify-center"></div>
        <button type="button" id="googleFallback"
          class="w-full flex items-center justify-center gap-2 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-full text-sm transition">
          <svg class="w-4 h-4" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Cadastrar com o Google
        </button>

        <p class="text-center text-sm text-slate-500 mt-4">
          Já tem conta?
          <a id="linkLogin" href="login.html" class="font-bold text-blue-700 hover:underline">Entrar</a>
        </p>
        <p class="text-center text-[11px] text-slate-400 mt-3">
          Ao criar a conta você poderá gerenciar imóveis e reservas.
        </p>
      </div>
    </section>

    <!-- Foto real de Florianópolis (ver img/CREDITOS.md) -->
    <aside class="hidden lg:block relative m-4 rounded-2xl overflow-hidden bg-blue-100">
      <img src="img/florianopolis.jpg" alt="Praia de Canasvieiras, em Florianópolis, SC, com os prédios à beira-mar"
        class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-blue-950/85 via-blue-950/20 to-transparent"></div>
      <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
        <p class="text-xs font-semibold uppercase tracking-widest text-blue-200">Operação Canasvieiras • Florianópolis/SC</p>
        <p class="mt-2 text-2xl font-bold leading-snug">Gestão inteligente de imóveis para temporada.</p>
      </div>
    </aside>
  </main>

  <footer class="text-[11px] text-blue-200 text-center">
    Foto: Canasvieiras, Florianópolis/SC.
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-externo.js"></script>
  <script>lucide.createIcons();</script>
  <script>
    // Volta para onde a pessoa estava. Só aceita caminho relativo do próprio
    // site: um redirectTo apontando para outro domínio seria um vetor de
    // phishing depois do login.
    function destinoDeRetorno() {
      var alvo = new URLSearchParams(location.search).get('redirectTo');
      if (!alvo || !alvo.startsWith('/') || alvo.startsWith('//')) {
        return 'index.html';
      }
      return alvo;
    }

    function mostrarErro(id, mensagem) {
      var campo = document.getElementById(id);
      var alvo = document.getElementById('erro-' + id);
      if (alvo) {
        alvo.innerText = mensagem;
        alvo.classList.toggle('hidden', !mensagem);
      }
      if (campo) {
        campo.classList.toggle('border-rose-400', !!mensagem);
        campo.classList.toggle('border-slate-300', !mensagem);
      }
      return !mensagem;
    }

    function limparErros(ids) {
      ids.forEach(function (id) { mostrarErro(id, ''); });
      var caixa = document.getElementById('mensagemGeral');
      caixa.classList.add('hidden');
      caixa.innerText = '';
    }

    function erroGeral(mensagem) {
      var caixa = document.getElementById('mensagemGeral');
      caixa.innerText = mensagem;
      caixa.classList.remove('hidden');
    }

    function emailValido(valor) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor);
    }

    function carregando(ativo, textoOriginal) {
      var botao = document.getElementById('btnSubmit');
      botao.disabled = ativo;
      botao.className = 'w-full text-white font-semibold py-3 rounded-full shadow-md shadow-blue-600/20 text-sm transition ' +
        (ativo ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700');
      botao.innerHTML = ativo
        ? '<span class="inline-block w-3.5 h-3.5 mr-2 border-2 border-white/40 border-t-white rounded-full animate-spin align-[-2px]"></span>Aguarde...'
        : textoOriginal;
    }

    document.getElementById('formAuth').addEventListener('submit', async function (evento) {
      evento.preventDefault();
      var ids = ['nome', 'email', 'senha', 'confirmacaoSenha'];
      limparErros(ids);

      var nome = document.getElementById('nome').value.trim();
      var email = document.getElementById('email').value.trim();
      var senha = document.getElementById('senha').value;
      var confirmacao = document.getElementById('confirmacaoSenha').value;

      var captchaToken = AuthExterno.exigirCaptcha();

      var ok = true;
      if (!nome) { ok = mostrarErro('nome', 'Informe seu nome.') && ok; }
      if (!email) { ok = mostrarErro('email', 'Informe seu e-mail.') && ok; }
      else if (!emailValido(email)) { ok = mostrarErro('email', 'E-mail inválido.') && ok; }
      if (senha.length < 8) { ok = mostrarErro('senha', 'A senha deve ter ao menos 8 caracteres.') && ok; }
      if (!confirmacao) { ok = mostrarErro('confirmacaoSenha', 'Confirme a senha.') && ok; }
      else if (senha !== confirmacao) { ok = mostrarErro('confirmacaoSenha', 'As senhas não conferem.') && ok; }
      if (!captchaToken) { ok = false; }
      if (!ok) { return; }

      carregando(true);
      try {
        var r = await Api.post('/api/auth/cadastro', {
          nome: nome, email: email, senha: senha, confirmacaoSenha: confirmacao,
          captchaToken: captchaToken
        }, { ignorar401: true });
        Auth.definirSessao(r.token, r.usuario);
        location.href = destinoDeRetorno();
      } catch (e) {
        // O servidor devolve os erros por campo; realça cada um deles.
        if (e.body && e.body.campos) {
          Object.keys(e.body.campos).forEach(function (campo) {
            mostrarErro(campo, e.body.campos[campo]);
          });
        }
        erroGeral(e.message || 'Não foi possível criar a conta.');
        carregando(false, 'Criar conta');
        AuthExterno.resetarCaptcha();
      }
    });

    function entrar(resposta) {
      Auth.definirSessao(resposta.token, resposta.usuario);
      location.href = destinoDeRetorno();
    }

    AuthExterno.iniciar({
      textoGoogle: 'signup_with',
      limpar: function () { limparErros(['nome', 'email', 'senha', 'confirmacaoSenha']); },
      aoEntrar: entrar,
      aoErro: erroGeral
    });

    document.addEventListener('DOMContentLoaded', function () {
      var alvo = new URLSearchParams(location.search).get('redirectTo');
      document.getElementById('linkLogin').href =
        'login.html' + (alvo ? '?redirectTo=' + encodeURIComponent(alvo) : '');
    });

  </script>
</body>
</html>

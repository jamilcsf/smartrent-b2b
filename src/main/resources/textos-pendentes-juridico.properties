# =====================================================================
# TEXTOS PROVISORIOS - PENDENTES DE REVISAO DO SETOR JURIDICO
#
# Todo texto de interface, e-mail e mensagem de sistema sobre cancelamento e
# reembolso fica aqui, em um unico lugar, para ser trocado quando o juridico
# entregar o texto definitivo. NAO sao textos juridicos: nao mencionam direito
# de arrependimento nem artigos de lei (assunto em stand-by). Os marcadores %s
# sao preenchidos pelo codigo.
# =====================================================================

politica.versao=PROVISORIA-1
politica.resumo=Cancelamento com reembolso integral até %s horas antes do horário de check-in (até %s, horário de Brasília). Depois desse prazo o cancelamento é permitido, mas sem reembolso. Não há reembolso por saída antecipada nem por não comparecimento.
politica.texto-completo=POLÍTICA DE CANCELAMENTO (TEXTO PROVISÓRIO, PENDENTE DE REVISÃO JURÍDICA)\n\n1. Cancelamento pelo cliente com pelo menos %s horas de antecedência do horário de check-in: reembolso integral do valor pago, incluindo a taxa de limpeza, para o mesmo meio de pagamento.\n2. Cancelamento pelo cliente com menos de %s horas de antecedência: o cancelamento é permitido, mas não há reembolso.\n3. Cancelamento pelo gestor: reembolso integral ao cliente.\n4. Reserva pendente (ainda não paga): pode ser cancelada sem cobrança.\n5. Não há reembolso por saída antecipada nem por não comparecimento.\n6. Reservas feitas com menos de %s horas de antecedência do check-in não têm direito a reembolso.\n\nOs horários seguem o horário de Brasília. Este texto é provisório e será substituído pela versão definitiva.

cancelamento.cliente-com-reembolso=Reserva cancelada pelo cliente com reembolso integral.
cancelamento.cliente-sem-reembolso=Reserva cancelada pelo cliente sem reembolso, conforme a política.
cancelamento.gestor=Reserva cancelada pelo gestor, com reembolso integral ao cliente.
cancelamento.pendente=Reserva pendente cancelada, sem cobrança.
cancelamento.expirada=Reserva pendente expirada por falta de pagamento, sem cobrança.

simulacao.com-reembolso=Você receberá R$ %s de volta.
simulacao.sem-reembolso=Esta reserva não tem direito a reembolso.
simulacao.pendente=Esta reserva ainda não foi paga: o cancelamento é feito sem nenhuma cobrança.

reserva.aviso-sem-reembolso=Atenção: como faltam menos de %s horas para o check-in, esta reserva não terá direito a reembolso se for cancelada.

reembolso.prazo=O prazo para o valor aparecer na sua fatura ou conta depende do meio de pagamento e é informado pelo emissor.
reembolso.pendente=O reembolso está em processamento.
reembolso.falha=O reembolso não pôde ser concluído agora e será tentado novamente automaticamente.

# =====================================================================
# PERFIL: avisos por e-mail e textos da exclusao de dados (PROVISORIOS)
# Pendentes de revisao do setor responsavel. Nada aqui define prazos de retencao,
# base legal ou tempo de resposta ao titular: isso depende do juridico.
# =====================================================================

perfil.email.senha-alterada.assunto=SmartRent: a senha da sua conta foi alterada
perfil.email.senha-alterada.corpo=Olá, %s.

A senha da sua conta SmartRent foi alterada em %s (horário de Brasília) e as outras sessões abertas foram encerradas.

Se não foi você, entre em contato com o suporte imediatamente.

perfil.email.resposta-neutra=Se o e-mail puder ser usado, enviamos um link de confirmação para ele. O link vale por %d minutos. Até a confirmação, você continua entrando com o e-mail atual.
perfil.email.confirmar.assunto=SmartRent: confirme o seu novo e-mail
perfil.email.confirmar.corpo=Olá, %s.\n\nRecebemos um pedido para usar este endereço como e-mail de login da sua conta SmartRent. Para confirmar, abra o link abaixo em até %d minutos:\n\n%s\n\nSe você não fez esse pedido, ignore esta mensagem: nada será alterado.
perfil.email.troca-solicitada-antigo.assunto=SmartRent: pedido de troca do e-mail da sua conta
perfil.email.troca-solicitada-antigo.corpo=Olá, %s.\n\nFoi solicitada a troca do e-mail de login da sua conta SmartRent em %s (horário de Brasília). O e-mail só muda se o link enviado ao novo endereço for confirmado.\n\nSe não foi você, altere sua senha e entre em contato com o suporte imediatamente.
perfil.email.alterado-antigo.assunto=SmartRent: o e-mail da sua conta foi alterado
perfil.email.alterado-antigo.corpo=Olá, %s.\n\nO e-mail de login da sua conta SmartRent foi alterado em %s (horário de Brasília) e as sessões abertas foram encerradas.\n\nSe não foi você, entre em contato com o suporte imediatamente.

# --- Solicitacao de exclusao de dados (TEXTOS PROVISORIOS, PENDENTES DE REVISAO) ---
perfil.exclusao.modal.texto=Seu pedido de exclusão de dados será analisado pela equipe da SmartRent antes de qualquer exclusão. Nada é apagado automaticamente. Podemos pedir uma verificação adicional de identidade. Alguns dados e o histórico da conta podem precisar ser mantidos por obrigação legal. A análise só pode ser concluída depois de %d horas, para que você tenha tempo de cancelar o pedido se ele não foi feito por você.
perfil.exclusao.cancelada-por-link=Solicitação cancelada. As restrições temporárias da conta foram removidas. Se você não fez esse pedido, recomendamos trocar a sua senha.

perfil.exclusao.email-usuario.assunto=SmartRent: recebemos o seu pedido de exclusão de dados
perfil.exclusao.email-usuario.corpo=Olá, %s.\n\nRecebemos em %s (horário de Brasília) um pedido de exclusão dos dados da sua conta. O pedido será analisado pela equipe e nada foi excluído.\n\nEnquanto o pedido estiver em análise, algumas ações ficam temporariamente indisponíveis:\n%s\n\nSe não foi você, cancele o pedido agora abrindo o link abaixo:\n%s
perfil.exclusao.email-equipe.assunto=[SmartRent] Nova solicitação de exclusão de dados #%d
perfil.exclusao.email-equipe.corpo=Solicitação #%d (usuário #%d, perfil %s) registrada em %s (UTC). Análise liberada a partir de %s (UTC).\n\nSinais de risco: %s\n\nNenhum dado foi excluído. A análise e a decisão cabem à equipe.

# --- Restricoes temporarias enquanto o pedido esta em andamento (PROVISORIOS) ---
perfil.restricao.descricao.NOVA_RESERVA=Criar novas reservas.
perfil.restricao.descricao.ANUNCIOS_SEM_NOVAS_RESERVAS=Seus anúncios deixam de aceitar novas reservas.
perfil.restricao.descricao.PUBLICAR_ANUNCIO=Publicar ou republicar anúncios.
perfil.restricao.descricao.CONFIRMAR_EDICAO=Confirmar alterações de anúncios já publicados.
perfil.restricao.descricao.ALTERAR_EMAIL=Alterar o e-mail da conta.
perfil.restricao.msg.NOVA_RESERVA=Não é possível criar novas reservas enquanto houver uma solicitação de exclusão de dados em análise. Suas reservas existentes continuam valendo.
perfil.restricao.msg.PUBLICAR_ANUNCIO=Não é possível publicar ou republicar anúncios enquanto houver uma solicitação de exclusão de dados em análise.
perfil.restricao.msg.CONFIRMAR_EDICAO=Não é possível confirmar alterações de anúncios enquanto houver uma solicitação de exclusão de dados em análise. Você ainda pode descartar a edição.
perfil.restricao.msg.ALTERAR_EMAIL=Não é possível alterar o e-mail enquanto houver uma solicitação de exclusão de dados em análise. Cancele a solicitação ou aguarde a decisão.
perfil.restricao.msg.ANUNCIOS_SEM_NOVAS_RESERVAS=Seus anúncios não aceitam novas reservas enquanto houver uma solicitação de exclusão de dados em análise.
perfil.restricao.aviso=Há uma solicitação de exclusão de dados em análise. Algumas ações estão temporariamente indisponíveis.
perfil.restricao.imovel-indisponivel=Este imóvel não está disponível para novas reservas no momento.

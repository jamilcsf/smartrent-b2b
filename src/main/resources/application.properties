server.port=8080

# Banco de dados: PostgreSQL (Supabase em producao).
# RNF03 - credenciais vem exclusivamente do ambiente, nunca do codigo-fonte.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RNF05 - o schema e versionado por migration; o Hibernate apenas valida,
# nunca altera. Ver docs/adr/ADR-002-estrategia-de-schema.md.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O Flyway aplica db/migration no boot, antes de o Hibernate validar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Desligado de proposito: ligado, num schema nao-vazio o Flyway marcaria a V1
# como ja aplicada e a pularia, deixando o banco sem as tabelas.
spring.flyway.baseline-on-migrate=false

# Autenticacao. O segredo vem do ambiente (RNF03); o valor de
# desenvolvimento abaixo so vale quando JWT_SECRET nao esta definido e
# jamais deve ser usado fora da maquina local.
smartrent.jwt.secret=${JWT_SECRET:desenvolvimento-local-trocar-em-producao-min-32-bytes}
smartrent.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:86400}

# reCAPTCHA v2 (login). Os valores padrao sao as chaves de TESTE publicadas
# pelo Google: funcionam em qualquer dominio, mas aprovam qualquer token. Em
# producao, defina RECAPTCHA_SITE_KEY e RECAPTCHA_SECRET (RNF03).
smartrent.captcha.site-key=${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
smartrent.captcha.secret=${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}

# Login com Google. Sem GOOGLE_CLIENT_ID o botao aparece, mas avisa que o
# recurso nao esta configurado. O client ID e criado no Google Cloud Console.
smartrent.google.client-id=${GOOGLE_CLIENT_ID:}

# Motor de precificação. Sem a chave, o cliente falha e a regra de
# contingência assume, marcando a origem do cálculo (RF09).
smartrent.groq.api-key=${GROQ_API_KEY:}

server.port=8080

# Banco de dados: PostgreSQL (Supabase em producao).
# RNF03 - credenciais vem exclusivamente do ambiente, nunca do codigo-fonte.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RNF05 - o schema e versionado por migration; o Hibernate apenas valida,
# nunca altera. Ver docs/adr/ADR-002-estrategia-de-schema.md.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O Flyway aplica db/migration no boot, antes de o Hibernate validar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Desligado de proposito: ligado, num schema nao-vazio o Flyway marcaria a V1
# como ja aplicada e a pularia, deixando o banco sem as tabelas.
spring.flyway.baseline-on-migrate=false

# Autenticacao. O segredo vem do ambiente (RNF03); o valor de
# desenvolvimento abaixo so vale quando JWT_SECRET nao esta definido e
# jamais deve ser usado fora da maquina local.
smartrent.jwt.secret=${JWT_SECRET:desenvolvimento-local-trocar-em-producao-min-32-bytes}
smartrent.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:86400}

# reCAPTCHA v2 (login). Os valores padrao sao as chaves de TESTE publicadas
# pelo Google: funcionam em qualquer dominio, mas aprovam qualquer token. Em
# producao, defina RECAPTCHA_SITE_KEY e RECAPTCHA_SECRET (RNF03).
smartrent.captcha.site-key=${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
smartrent.captcha.secret=${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}

# Login com Google. O client ID e publico (nao e segredo) e identifica o
# projeto "SmartRent" no Google Cloud; o valor padrao abaixo vale para o
# desenvolvimento local (origem http://localhost:8080) e pode ser trocado por
# GOOGLE_CLIENT_ID. Enquanto o app estiver em modo de teste no Google, so
# entram os e-mails cadastrados como usuarios de teste.
smartrent.google.client-id=${GOOGLE_CLIENT_ID:967992016055-67udv6jb982ao4fhn81fclo7je20qcfs.apps.googleusercontent.com}

# Motor de precificação. Sem a chave, o cliente falha e a regra de
# contingência assume, marcando a origem do cálculo (RF09).
smartrent.groq.api-key=${GROQ_API_KEY:}
smartrent.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
smartrent.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
smartrent.groq.timeout-ms=${GROQ_TIMEOUT_MS:15000}

# Ciclo de vida do anuncio (horas). Em desenvolvimento, reduza para testar o
# fluxo sem esperar (ex.: SMARTRENT_JANELA_PRE_PUBLICACAO_HORAS=0).
smartrent.anuncio.janela-pre-publicacao-horas=${SMARTRENT_JANELA_PRE_PUBLICACAO_HORAS:24}
smartrent.anuncio.republicacao-horas=${SMARTRENT_REPUBLICACAO_HORAS:2}
smartrent.anuncio.lembrete-apos-horas=${SMARTRENT_LEMBRETE_APOS_HORAS:24}
smartrent.anuncio.lembrete-intervalo-horas=${SMARTRENT_LEMBRETE_INTERVALO_HORAS:24}
smartrent.anuncio.lembrete-max=${SMARTRENT_LEMBRETE_MAX:5}
# Jobs agendados (republicacao, promocao de pre-publicacao, lembretes).
smartrent.jobs.habilitado=${SMARTRENT_JOBS_HABILITADO:true}

# Midias dos anuncios. Disco local por padrao; o MidiaStorage permite trocar
# por armazenamento de objetos (S3) sem mexer nas regras.
smartrent.midia.diretorio=${MIDIA_DIRETORIO:./dados/midias}
smartrent.midia.tamanho-max-imagem-mb=${MIDIA_TAMANHO_MAX_IMAGEM_MB:10}
smartrent.midia.tamanho-max-video-mb=${MIDIA_TAMANHO_MAX_VIDEO_MB:100}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# IP do aceite do termo (auditoria). Atras de proxy/balanceador (Render etc.),
# defina FORWARD_HEADERS_STRATEGY=framework para usar X-Forwarded-For; sem proxy
# confiavel, mantenha "none", pois o cabecalho pode ser forjado.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Fuso oficial da plataforma (nome IANA, nunca deslocamento fixo). Define "hoje",
# virada de dia/mes e exibicao; duracoes (24h, 2h, lembretes) seguem em tempo decorrido.
smartrent.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# Reserva autoatendida e politica de cancelamento (valores do produto como padrao).
# CANCEL_REGRET_DAYS (direito de arrependimento) fica em 0 = desligado e sem efeito:
# item em espera do setor juridico, nao ligar por conta propria.
smartrent.reserva.pendente-expira-minutos=${RESERVA_PENDENTE_EXPIRA_MINUTOS:30}
smartrent.cancelamento.antecedencia-horas=${CANCEL_ANTECEDENCIA_HORAS:48}
smartrent.cancelamento.regret-dias=${CANCEL_REGRET_DAYS:0}
smartrent.cancelamento.versao=${CANCEL_POLITICA_VERSAO:PROVISORIA-1}
smartrent.cancelamento.checkin-hora=${CHECKIN_HORA_PADRAO:14:00}
smartrent.cancelamento.checkout-hora=${CHECKOUT_HORA_PADRAO:11:00}

# SmartChat: dominios proprios (links deles NAO sao borrados), lista de termos opcional,
# limites e a flag do bloqueio de usuario (prototipo: false = so registra, sem efeito).
smartrent.chat.dominios-permitidos=${SMARTCHAT_DOMINIOS_PERMITIDOS:smartrent.com.br,localhost}
smartrent.chat.termos-arquivo=${SMARTCHAT_TERMOS_ARQUIVO:}
smartrent.chat.bloqueio-ativo=${SMARTCHAT_BLOCK_ENFORCEMENT:false}
smartrent.chat.max-caracteres=${SMARTCHAT_MAX_CARACTERES:1000}
smartrent.chat.mensagens-por-minuto=${SMARTCHAT_MENSAGENS_POR_MINUTO:20}
smartrent.chat.notificacao-agrupamento-min=${SMARTCHAT_NOTIFICACAO_AGRUPAMENTO_MIN:10}
# Cifra em repouso das mensagens (AES-256-GCM; NAO e ponta a ponta, ver ADR-006). Base64 de 32 bytes
# (openssl rand -base64 32). Sem valor padrao: fora dos perfis dev/test a aplicacao nao sobe sem a chave.
# Perder a chave torna as mensagens irrecuperaveis.
smartrent.chat.crypto-key=${SMARTCHAT_CRYPTO_KEY:}
# Cifra, no boot, as linhas antigas em texto puro (idempotente; so registra contagens). Pode ser desligada depois.
smartrent.chat.migrar-cifra-ao-iniciar=${SMARTCHAT_CRYPTO_MIGRATE_ON_START:true}

# Videos do anuncio: ate 1:30 (90 s), envio em partes, processamento assincrono. Sem FFmpeg
# (ffmpeg-path vazio e nada no PATH) usa o processamento basico, sem HLS/poster/metadados.
smartrent.video.ffmpeg-path=${VIDEO_FFMPEG_PATH:}
smartrent.video.ffprobe-path=${VIDEO_FFPROBE_PATH:}
smartrent.video.duracao-max-segundos=${VIDEO_DURACAO_MAX_SEGUNDOS:90}
smartrent.video.tamanho-max-mb=${VIDEO_TAMANHO_MAX_MB:500}
smartrent.video.altura-max-entrada=${VIDEO_ALTURA_MAX_ENTRADA:2160}
smartrent.video.parte-mb=${VIDEO_PARTE_MB:5}
smartrent.video.apagar-original=${VIDEO_APAGAR_ORIGINAL:true}
smartrent.video.timeout-segundos=${VIDEO_TIMEOUT_SEGUNDOS:600}
smartrent.video.max-tentativas=${VIDEO_MAX_TENTATIVAS:3}
smartrent.video.orfao-horas=${VIDEO_ORFAO_HORAS:24}

# Perfil do usuario: foto (tamanho, dimensoes, protecao contra decompression bomb), politica da
# nova senha, link de confirmacao de e-mail e limites de tentativas. Padroes do produto.
smartrent.perfil.foto-max-mb=${PERFIL_FOTO_MAX_MB:2}
smartrent.perfil.foto-min-lado=${PERFIL_FOTO_MIN_LADO:128}
smartrent.perfil.foto-max-pixels=${PERFIL_FOTO_MAX_PIXELS:25000000}
smartrent.perfil.foto-lado=${PERFIL_FOTO_LADO:512}
smartrent.perfil.senha-minima=${PERFIL_SENHA_MINIMA:10}
smartrent.perfil.senhas-comuns-arquivo=${PERFIL_SENHAS_COMUNS_ARQUIVO:}
smartrent.perfil.email-token-minutos=${PERFIL_EMAIL_TOKEN_MINUTOS:60}
smartrent.perfil.senha-tentativas=${PERFIL_SENHA_TENTATIVAS:5}
smartrent.perfil.senha-janela-minutos=${PERFIL_SENHA_JANELA_MINUTOS:15}
smartrent.perfil.email-pedidos-por-hora=${PERFIL_EMAIL_PEDIDOS_POR_HORA:3}
smartrent.perfil.foto-uploads-por-hora=${PERFIL_FOTO_UPLOADS_POR_HORA:10}
# Endereco publico do site (links enviados por e-mail).
smartrent.perfil.base-url=${APP_BASE_URL:http://localhost:8080}

# E-mail: enquanto nao ha SMTP, so registra em log. EMAIL_LOG_CORPO=false em producao para
# que links com token nunca fiquem em log (so o destinatario e o assunto sao registrados).
smartrent.email.log-corpo=${EMAIL_LOG_CORPO:true}

# Solicitacao de exclusao de dados: nada e excluido automaticamente; o pedido passa por analise da
# equipe e, enquanto esta em andamento, a conta sofre restricoes temporarias parciais. Estes valores
# sao configuracao, nao decisao juridica (periodo de analise, retencao e execucao dependem do juridico).
smartrent.exclusao-dados.min-analise-horas=${DATA_DELETION_MIN_REVIEW_HOURS:48}
smartrent.exclusao-dados.risco-dias=${DATA_DELETION_RISK_DAYS:30}
smartrent.exclusao-dados.notificar-email=${DATA_DELETION_NOTIFY_EMAIL:}
smartrent.exclusao-dados.restricoes-ativas=${DATA_DELETION_RESTRICTIONS_ENABLED:true}
smartrent.exclusao-dados.pedidos-por-dia=${DATA_DELETION_REQUESTS_PER_DAY:3}

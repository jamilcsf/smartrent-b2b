server.port=8080

# Banco de dados: PostgreSQL (Supabase em producao).
# RNF03 - credenciais vem exclusivamente do ambiente, nunca do codigo-fonte.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RNF05 - o schema e versionado por migration; o Hibernate apenas valida,
# nunca altera. Ver docs/adr/ADR-002-estrategia-de-schema.md.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# O Flyway aplica db/migration no boot, antes de o Hibernate validar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Desligado de proposito: ligado, num schema nao-vazio o Flyway marcaria a V1
# como ja aplicada e a pularia, deixando o banco sem as tabelas.
spring.flyway.baseline-on-migrate=false

# Autenticacao. O segredo vem do ambiente (RNF03); o valor de
# desenvolvimento abaixo so vale quando JWT_SECRET nao esta definido e
# jamais deve ser usado fora da maquina local.
smartrent.jwt.secret=${JWT_SECRET:desenvolvimento-local-trocar-em-producao-min-32-bytes}
smartrent.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:86400}

# reCAPTCHA v2 (login). Os valores padrao sao as chaves de TESTE publicadas
# pelo Google: funcionam em qualquer dominio, mas aprovam qualquer token. Em
# producao, defina RECAPTCHA_SITE_KEY e RECAPTCHA_SECRET (RNF03).
smartrent.captcha.site-key=${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
smartrent.captcha.secret=${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}

# Login com Google. O client ID e publico (nao e segredo) e identifica o
# projeto "SmartRent" no Google Cloud; o valor padrao abaixo vale para o
# desenvolvimento local (origem http://localhost:8080) e pode ser trocado por
# GOOGLE_CLIENT_ID. Enquanto o app estiver em modo de teste no Google, so
# entram os e-mails cadastrados como usuarios de teste.
smartrent.google.client-id=${GOOGLE_CLIENT_ID:967992016055-67udv6jb982ao4fhn81fclo7je20qcfs.apps.googleusercontent.com}

# Motor de precificação. Sem a chave, o cliente falha e a regra de
# contingência assume, marcando a origem do cálculo (RF09).
smartrent.groq.api-key=${GROQ_API_KEY:}
smartrent.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
smartrent.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
smartrent.groq.timeout-ms=${GROQ_TIMEOUT_MS:15000}

# Ciclo de vida do anuncio (horas). Em desenvolvimento, reduza para testar o
# fluxo sem esperar (ex.: SMARTRENT_JANELA_PRE_PUBLICACAO_HORAS=0).
smartrent.anuncio.janela-pre-publicacao-horas=${SMARTRENT_JANELA_PRE_PUBLICACAO_HORAS:24}
smartrent.anuncio.republicacao-horas=${SMARTRENT_REPUBLICACAO_HORAS:2}
smartrent.anuncio.lembrete-apos-horas=${SMARTRENT_LEMBRETE_APOS_HORAS:24}
smartrent.anuncio.lembrete-intervalo-horas=${SMARTRENT_LEMBRETE_INTERVALO_HORAS:24}
smartrent.anuncio.lembrete-max=${SMARTRENT_LEMBRETE_MAX:5}
# Jobs agendados (republicacao, promocao de pre-publicacao, lembretes).
smartrent.jobs.habilitado=${SMARTRENT_JOBS_HABILITADO:true}

# Midias dos anuncios. Disco local por padrao; o MidiaStorage permite trocar
# por armazenamento de objetos (S3) sem mexer nas regras.
smartrent.midia.diretorio=${MIDIA_DIRETORIO:./dados/midias}
smartrent.midia.tamanho-max-imagem-mb=${MIDIA_TAMANHO_MAX_IMAGEM_MB:10}
smartrent.midia.tamanho-max-video-mb=${MIDIA_TAMANHO_MAX_VIDEO_MB:100}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

spring:
  application:
    name: smartrent-b2b

  datasource:
    # Credenciais vêm exclusivamente do ambiente (ver .env.example).
    # Nunca versionar usuário/senha do Supabase neste arquivo.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Aplica db/migration no boot, antes do Hibernate validar o schema.
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate fica desligado de propósito: com ele ligado e um
    # schema não-vazio, o Flyway marcaria a V1 como já aplicada e a pularia,
    # deixando o banco sem as tabelas.
    baseline-on-migrate: false

  jpa:
    hibernate:
      # O schema é versionado por migration; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.smartrentb2b: INFO

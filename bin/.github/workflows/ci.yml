name: CI - SmartRent B2B Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Executar Build e Suíte de Testes (JUnit 5)
      run: ./mvnw clean test

    - name: Publicar Relatorio de Testes (Evidencias)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidencias-testes-junit
        path: target/surefire-reports/